services:
  - type: web
    name: itqan
    runtime: node
    buildCommand: |
      cd web/frontend
      npm ci --include=dev
      if [ ! -f public/fastconformer_ar_ctc_q8.onnx ]; then
        curl -L -o public/fastconformer_ar_ctc_q8.onnx \
          https://github.com/yazinsai/offline-tarteel/releases/download/v0.1.0/fastconformer_ar_ctc_q8.onnx
      fi
      npm run build
      npm run build:server
    startCommand: cd web/frontend && npm start
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health

<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Itqan</title>
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1918" media="(prefers-color-scheme: dark)">
  <meta name="description" content="On-device Quran verse recognition. Recite and see your verses highlighted in real time.">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Itqan">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>
  <div id="app">
    <!-- ── Loading screen (shown until model is ready) ── -->
    <div id="loading-status">
      <p class="loading-status-main">Preparing model...</p>
      <div class="loading-progress-track">
        <div class="loading-progress-fill" id="loading-progress"></div>
      </div>
      <p class="loading-status-sub" id="loading-detail">Downloading</p>
      <p class="loading-model-badge" id="model-status">Loading model...</p>
    </div>

    <!-- ── Main reading experience ── -->
    <div id="mushaf-container" hidden>
      <!-- Top bar: page number only -->
      <div class="top-bar">
        <span id="page-info" class="top-bar-page">1 / 604</span>
      </div>

      <!-- Mushaf page: takes all remaining space -->
      <div class="mushaf-page-wrap">
        <div id="mushaf-page" class="mushaf-page"></div>
      </div>
    </div>

    <!-- Algorithm view (toggled, replaces mushaf page area) -->
    <div id="algorithm-view" hidden>
      <div class="av-section av-transcript">
        <div class="av-section-label">Raw Transcript</div>
        <div id="av-transcript-text" class="av-transcript-text" dir="rtl" lang="ar"></div>
      </div>
      <div class="av-section av-narrowing">
        <div class="av-section-label">Candidate Narrowing</div>
        <div id="av-narrowing-cascade" class="av-narrowing-cascade"></div>
      </div>
      <div class="av-section av-candidates">
        <div class="av-section-label">Top Candidates</div>
        <div id="av-candidate-list" class="av-candidate-list"></div>
      </div>
      <div class="av-section av-disambig">
        <div id="av-disambig-info" class="av-disambig-info"></div>
      </div>
      <div id="av-identified" class="av-section av-identified" hidden>
        <div class="av-identified-badge">IDENTIFIED</div>
        <div id="av-identified-ref" class="av-identified-ref"></div>
        <div id="av-identified-text" class="av-identified-text" dir="rtl" lang="ar"></div>
        <div id="av-identified-stats" class="av-identified-stats"></div>
      </div>
    </div>

    <!-- ── Bottom control bar (always visible, fixed) ── -->
    <div id="bottom-bar">
      <div class="bottom-bar-inner">
        <!-- Left: Practice mode -->
        <button id="btn-practice" class="bb-btn" title="Practice Mode">
          <svg class="practice-icon practice-icon--off" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg class="practice-icon practice-icon--on" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>

        <!-- Center-left: Algorithm view -->
        <button id="btn-algo-view" class="bb-btn" title="Algorithm View">
          <svg class="algo-icon algo-icon--off" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
          </svg>
          <svg class="algo-icon algo-icon--on" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
            stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
          </svg>
        </button>

        <!-- Center: Record button (large, prominent) -->
        <button id="btn-rec-toggle" class="bb-btn bb-btn--rec" title="Start recitation">
          <svg class="rec-icon rec-icon--mic" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <svg class="rec-icon rec-icon--stop" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
        </button>

        <!-- Center-right: Wrong button (hidden by default, slides in after verse_match) -->
        <button id="btn-wrong" class="bb-btn bb-btn--wrong" title="Report wrong match" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </button>

        <!-- Right: Page arrows -->
        <div class="bb-nav-arrows">
          <button id="btn-page-next" class="bb-nav-btn" title="Next page">&rsaquo;</button>
          <button id="btn-page-prev" class="bb-nav-btn" title="Previous page">&lsaquo;</button>
        </div>
      </div>
    </div>

    <!-- Hidden elements kept for legacy flowing mode / internals -->
    <div id="candidate-list" style="display:none"></div>
    <div id="post-recording" hidden>
      <div class="post-actions">
        <button id="btn-restart" class="action-btn action-btn--restart">Start Again</button>
      </div>
    </div>
    <div id="verses"></div>
    <div id="raw-transcript"></div>
    <div id="listening-indicator" style="display:none">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-dot"></div>
    </div>
    <div id="permission-prompt" hidden>
      <p>Microphone access is needed to listen to your recitation.</p>
    </div>

    <!-- Feedback UI is dynamically created by feedback.ts -->
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
